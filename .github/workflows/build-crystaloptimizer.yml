name: Build Crystal Optimizer (Forge 1.16.5)

on:
  workflow_dispatch:
  push:
    paths:
      - 'crystaloptimizer/**'
      - '.github/workflows/build-crystaloptimizer.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Set up Gradle 6.9.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 6.9.4

      - name: Build
        working-directory: crystaloptimizer
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: marlows-crystal-optimizer-forge-1.16.5
          path: crystaloptimizer/build/libs/*.jar
